version: "3.9"

services:
  bot:
    build: .
    image: kobong-vpn-bot:latest
    container_name: kobong-vpn-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # No ports exposed — bot polls Pakasir outbound, no webhook needed.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python -m bot"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
