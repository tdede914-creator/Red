version: "3.9"

services:
  bot:
    build: .
    image: kobong-vpn-bot:latest
    container_name: kobong-vpn-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8080)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: reverse proxy for webhook TLS
